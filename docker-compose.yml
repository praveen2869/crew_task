version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: crew_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crew_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - JINA_API_KEY=${JINA_API_KEY}
      - JINA_EMBEDDING_MODEL=${JINA_EMBEDDING_MODEL:-jina-embeddings-v5-omni-small}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=knowledge_base
      - ENVIRONMENT=production
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Streamlit Interactive Web Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crew_rag_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - JINA_API_KEY=${JINA_API_KEY}
      - JINA_EMBEDDING_MODEL=${JINA_EMBEDDING_MODEL:-jina-embeddings-v5-omni-small}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=knowledge_base
    depends_on:
      api:
        condition: service_started
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  qdrant_storage:
